microservice.url=${MICROSERVICE_URL}

# =======================
# DATABASE CONFIGURATION
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================
# REDIS CONFIGURATION
# =======================
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}
spring.data.redis.timeout=60s

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =======================
# HIKARI CONNECTION POOL
# =======================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# =======================
# THYMELEAF
# =======================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true
# enable cache for production

# =======================
# STATIC RESOURCES
# =======================
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# =======================
# SERVER SETTINGS
# =======================
server.port=${PORT:8080}
# Railway dynamically assigns PORT

# =======================
# LOGGING (Production-Safe)
# =======================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO

# =======================
# MAIL CONFIGURATION
# =======================
brevo.api.key=${BREVO_API_KEY}
brevo.sender.name=${BREVO_SENDER_NAME}
brevo.sender.email=${BREVO_SENDER_EMAIL}
feedback.recipient.email=${FEEDBACK_RECIPIENT_EMAIL}

# =======================
# MANAGEMENT (OPTIONAL)
# =======================
management.endpoints.web.exposure.include=health,info
