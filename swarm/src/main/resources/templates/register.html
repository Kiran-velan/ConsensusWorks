<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Organizer Registration | ConsensusWorks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <!-- Custom Styling -->
    <style>
        :root {
          --primary: #2e7d32;
          --primary-dark: #1b5e20;
          --secondary: #0288d1;
          --light: #f5f5f6;
          --dark: #263238;
        }

        body {
          font-family: 'Poppins', sans-serif;
          background-color: var(--light);
          margin: 0;
          padding: 0;
        }

        .header {
          background: linear-gradient(135deg, var(--primary), var(--secondary));
          color: white;
          padding: 20px 40px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .header .logo {
          font-size: 1.5rem;
          font-weight: 600;
          text-decoration: none;
          color: white;
        }

        .header .nav-links a {
          color: white;
          margin-left: 25px;
          font-weight: 500;
          text-decoration: none;
        }

        .header .nav-links a:hover {
          color: #dcefff;
        }

        .register-container {
          max-width: 600px;
          margin: 60px auto;
          background-color: white;
          padding: 40px 30px;
          border-radius: 12px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .register-container h2 {
          color: var(--primary);
          margin-bottom: 25px;
          text-align: center;
          font-weight: 600;
        }

        .btn-primary-custom {
          background-color: var(--primary);
          border: none;
          padding: 10px;
          font-weight: 500;
          font-size: 1rem;
          transition: background 0.3s ease;
        }

        .btn-primary-custom:hover {
          background-color: var(--primary-dark);
        }

        .form-text-link {
          margin-top: 20px;
          font-size: 0.95rem;
        }

        .form-text-link a {
          color: var(--secondary);
          text-decoration: none;
          font-weight: 500;
        }

        .alert {
          font-size: 0.95rem;
        }

        @media (max-width: 576px) {
          .header {
            flex-direction: column;
            align-items: flex-start;
          }

          .header .nav-links {
            margin-top: 10px;
          }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <a class="logo" th:href="@{/}">ConsensusWorks Platform</a>
    <div class="nav-links">
        <a th:href="@{/login}"><i class="fas fa-sign-in-alt"></i> Login</a>
    </div>
</div>

<!-- Registration Form -->
<div class="container">
    <div class="register-container">
        <h2><i class="fas fa-user-plus"></i> Organizer Registration</h2>

        <div th:if="${param.success}">
            <div class="alert alert-info">
                Registration successful! Login to continue.
            </div>
        </div>

        <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" id="firstName" name="firstName" th:field="*{firstName}" class="form-control" placeholder="Enter first name">
                <p th:errors="*{firstName}" class="text-danger" th:if="${#fields.hasErrors('firstName')}"></p>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" id="lastName" name="lastName" th:field="*{lastName}" class="form-control" placeholder="Enter last name">
                <p th:errors="*{lastName}" class="text-danger" th:if="${#fields.hasErrors('lastName')}"></p>
            </div>

            <!-- ✅ Email with OTP -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                    <input type="email" id="email" name="email" th:field="*{email}" class="form-control" placeholder="Enter email address">
                    <button type="button" class="btn btn-outline-primary" id="sendOtpBtn">Get OTP</button>
                </div>
                <p th:errors="*{email}" class="text-danger" th:if="${#fields.hasErrors('email')}"></p>
            </div>

            <!-- ✅ OTP input -->
            <div class="mb-3" id="otpSection" style="display:none;">
                <label for="otp" class="form-label">Enter OTP</label>
                <div class="input-group">
                    <input type="text" id="otp" class="form-control" placeholder="Enter OTP">
                    <button type="button" class="btn btn-outline-success" id="verifyOtpBtn">Verify OTP</button>
                </div>
                <small id="otpStatus" class="form-text"></small>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" th:field="*{password}" class="form-control" placeholder="Enter password">
                <p th:errors="*{password}" class="text-danger" th:if="${#fields.hasErrors('password')}"></p>
            </div>

            <div class="d-grid">
                <!-- 🔒 Disabled until OTP verified -->
                <button type="submit" id="registerBtn" class="btn btn-primary-custom" disabled>Register</button>
            </div>

            <div class="form-text-link text-center">
                Already registered? <a th:href="@{/login}">Login here</a>
            </div>
        </form>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const sendOtpBtn = document.getElementById("sendOtpBtn");
        const verifyOtpBtn = document.getElementById("verifyOtpBtn");
        const otpSection = document.getElementById("otpSection");
        const otpStatus = document.getElementById("otpStatus");
        const registerBtn = document.getElementById("registerBtn");

        // ✅ Send OTP
        sendOtpBtn.addEventListener("click", function () {
            const email = document.getElementById("email").value;
            if (!email) {
                alert("Please enter email first");
                return;
            }

            fetch("/send-otp", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "email=" + encodeURIComponent(email)
            })
            .then(res => res.text())
            .then(msg => {
                otpSection.style.display = "block";
                otpStatus.textContent = msg;
                otpStatus.style.color = msg.includes("OTP sent") ? "green" : "red";
            });
        });

        // ✅ Verify OTP
        verifyOtpBtn.addEventListener("click", function () {
            const email = document.getElementById("email").value;
            const otp = document.getElementById("otp").value;

            fetch("/verify-otp", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "email=" + encodeURIComponent(email) + "&otp=" + encodeURIComponent(otp)
            })
            .then(res => res.text())
            .then(msg => {
                otpStatus.textContent = msg;
                if (msg.includes("Verified")) {
                    otpStatus.style.color = "green";
                    registerBtn.disabled = false; // ✅ enable register
                } else {
                    otpStatus.style.color = "red";
                }
            });
        });
    });
</script>

</body>
</html>
