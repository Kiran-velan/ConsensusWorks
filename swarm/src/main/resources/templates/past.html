<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Past Discussions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1976D2;
            color: white;
            border-radius: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .btn {
            background-color: #ffffff;
            color: #1976D2;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #bbdefb;
        }

        .table-container {
            margin-top: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 10px;
        }

        th {
            background-color: #1976D2;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f1f8fe;
        }

        .action-btn {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .action-btn:disabled {
            background-color: #cccccc;
            color: #222222;
            cursor: not-allowed;
            opacity: 0.6;
            border: 1px solid #aaa;
        }

        .delete-btn {
            background-color: #D32F2F;
        }

        .result-btn {
            background-color: #388E3C;
        }

        .report-btn {
            background-color: #FFD154;
            color: black;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }


        .action-btn:hover, .delete-btn:hover, .report-btn:hover {
            opacity: 0.75;
        }
    </style>
</head>
<body>
<div class="header-container">
    <h1>My Discussions</h1>
    <button class="btn" onclick="window.location.href='/organizer-dashboard'">Create New Discussion</button>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>Discussion Name</th>
            <th>Pass Key</th>
            <th>Scheduled Time</th>
            <th>Duration</th>
            <th>Actions</th>
            <th>Report</th>
        </tr>
        </thead>
        <tbody id="discussionTableBody">
        <!-- Dynamic Content Loaded Here -->
        </tbody>
    </table>
</div>

<script>
    // Function to load past discussions dynamically
    async function loadDiscussions() {
        const response = await fetch(`/discussions/past?nocache=${new Date().getTime()}`);
        if (!response.ok) {
            console.error('Failed to load discussions:', await response.text());
            return;
        }

        const discussions = await response.json();
        console.log("Fetched Discussions (Structure):", JSON.stringify(discussions, null, 2));

        if (!Array.isArray(discussions) || discussions.length === 0) {
            const tableBody = document.getElementById('discussionTableBody');
            tableBody.innerHTML = `<tr><td colspan="6">❗ No discussions found.</td></tr>`;
            return;
        }

        const tableBody = document.getElementById('discussionTableBody');
        tableBody.innerHTML = '';

        discussions.forEach(discussion => {
            const scheduledTime = new Date(discussion.scheduledTime);
            const durationMinutes = parseInt(discussion.duration || 0);
            const now = new Date();
            const sessionEndTime = new Date(scheduledTime.getTime() + durationMinutes * 60000);

            const isBeforeStart = now < scheduledTime;
            const isAfterEnd = now > sessionEndTime;
            const isDuringSession = now >= scheduledTime && now <= sessionEndTime;

            const updateDisabled = !isBeforeStart;
            const resultReportDisabled = !isAfterEnd;
            const deleteDisabled = isDuringSession;

            const row = `
                <tr>
                    <td>${discussion.discussionName || 'N/A'}</td>
                    <td>${discussion.uniqueCode || 'N/A'}</td>
                    <td>${formatDateTime(discussion.scheduledTime)}</td>
                    <td>${discussion.duration || 'N/A'}</td>
                    <td>
                        <button class="update-btn action-btn" onclick="updateDiscussion(${discussion.discussionId})" ${updateDisabled ? 'disabled title="Editing is closed."' : ''}>Update</button>
                        <button class="delete-btn action-btn" onclick="deleteDiscussion('${discussion.discussionName}', '${discussion.uniqueCode}')" ${deleteDisabled ? 'disabled title="Cannot delete during an active session."' : ''}>Delete</button>
                    </td>
                    <td>
<!--                        <button class="result-btn action-btn" onclick="generateResult('${discussion.discussionId}')" ${resultReportDisabled ? 'disabled title="Results available after session ends."' : ''}>Result</button>-->
                        <button class="report-btn action-btn" onclick="generateReport('${discussion.discussionId}')" ${resultReportDisabled ? 'disabled title="Report available after session ends."' : ''}>Report</button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    function formatDateTime(isoDateString) {
        if (!isoDateString) return 'N/A';

        const date = new Date(isoDateString);
        if (isNaN(date.getTime())) return isoDateString; // Return original if invalid

        // Format: dd-mm-yyyy hh:mm
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');

        return `${day}-${month}-${year} ${hours}:${minutes}`;
    }

    // Function to redirect to update page for a discussion
    async function updateDiscussion(discussionId) {
        window.location.href = `http://localhost:8080/update?discussionId=${discussionId}`;
    }

    // Function to redirect to result page for a discussion
    async function generateResult(discussionId) {
        window.location.href = `http://localhost:8080/result?discussionId=${discussionId}`;
    }

    // Function to generate a report for a discussion
    async function generateReport(discussionId) {
        window.location.href = `http://localhost:8080/report?discussionId=${discussionId}`;
    }

    // Function to delete a discussion
    async function deleteDiscussion(discussionName, uniqueCode) {
        if (confirm('Are you sure you want to delete this discussion?')) {
            try {
                const response = await fetch(`/discussions/delete/${discussionName}/${uniqueCode}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('✅ Discussion deleted successfully.');
                    loadDiscussions();  // Refresh the discussions table
                } else {
                    const errorMessage = await response.text();
                    alert(`❌ Error deleting discussion: ${errorMessage}`);
                }
            } catch (error) {
                console.error('Error deleting discussion:', error);
                alert('❌ An unexpected error occurred while deleting the discussion.');
            }
        }
    }

    // Load the discussions when the page is loaded
    window.onload = loadDiscussions;
</script>
</body>
</html>
