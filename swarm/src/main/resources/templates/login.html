<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Organizer Login | ConsensusWorks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Custom Styling -->
    <style>
        :root {
          --primary: #2e7d32;
          --primary-dark: #1b5e20;
          --secondary: #0288d1;
          --light: #f5f5f6;
          --dark: #263238;
          --gray: #607d8b;
        }

        body {
          font-family: 'Poppins', sans-serif;
          background-color: var(--light);
          margin: 0;
          padding: 0;
        }

        .header {
          background: linear-gradient(135deg, var(--primary), var(--secondary));
          color: white;
          padding: 20px 40px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .header .logo {
          font-size: 1.5rem;
          font-weight: 600;
          text-decoration: none;
          color: white;
        }

        .header .nav-links a {
          color: white;
          margin-left: 25px;
          font-weight: 500;
          text-decoration: none;
        }

        .header .nav-links a:hover {
          color: #dcefff;
        }

        .login-container {
          max-width: 500px;
          margin: 60px auto;
          background-color: white;
          padding: 40px 30px;
          border-radius: 12px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .login-container h2 {
          color: var(--primary);
          margin-bottom: 25px;
          text-align: center;
          font-weight: 600;
        }

        .btn-primary-custom {
          background-color: var(--primary);
          border: none;
          padding: 10px;
          font-weight: 500;
          font-size: 1rem;
          transition: background 0.3s ease;
        }

        .btn-primary-custom:hover {
          background-color: var(--primary-dark);
        }

        .form-text-link {
          text-align: center;
          margin-top: 20px;
          font-size: 0.95rem;
        }

        .form-text-link a {
          color: var(--secondary);
          text-decoration: none;
          font-weight: 500;
        }

        .alert {
          font-size: 0.95rem;
        }

        @media (max-width: 576px) {
          .header {
            flex-direction: column;
            align-items: flex-start;
          }

          .header .nav-links {
            margin-top: 10px;
          }
        }
    </style>
</head>
<body>

<!-- Header Navigation -->
<div class="header">
    <a class="logo" th:href="@{/}">ConsensusWorks Platform</a>
    <div class="nav-links">
        <a th:href="@{/register}"><i class="fas fa-user-plus"></i> Register</a>
    </div>
</div>

<!-- Login Card -->
<div class="container">
    <div class="login-container">
        <h2><i class="fas fa-user-lock"></i> Organizer Login</h2>

        <div th:if="${param.error}" class="alert alert-danger">Invalid Email or Password</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

        <form method="post" role="form" th:action="@{/login}">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary-custom">Login</button>
            </div>

            <div class="form-text-link">
                Not registered? <a th:href="@{/register}">Sign up here</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
