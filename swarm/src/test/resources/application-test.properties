# Test MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/swarm_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=swarm_test_user
spring.datasource.password=test_password_123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

